<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h2>Laporan Inventaris Barang</h2>
    <p>Tanggal Cetak: {{ tanggal }}</p>
    <table>
        <tr>
            <th>Kode</th>
            <th>Nama</th>
            <th>Jumlah</th>
            <th>Kondisi</th>
            <th>Lokasi</th>
            <th>Tanggal</th>
        </tr>
        {% for item in data %}
        <tr>
            <td>{{ item.kode }}</td>
            <td>{{ item.nama }}</td>
            <td>{{ item.jumlah }}</td>
            <td>{{ item.kondisi }}</td>
            <td>{{ item.lokasi }}</td>
            <td>{{ item.tanggal }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
