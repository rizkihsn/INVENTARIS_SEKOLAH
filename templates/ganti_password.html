{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}

{% block content %}
<h3 class="mb-4">Ganti Password</h3>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Password Lama</label>
        <input type="password" name="old_password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password Baru</label>
        <input type="password" name="new_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-warning"><i class="fas fa-key me-1"></i> Ganti Password</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Batal</a>
    </form>
  </div>
</div>
{% endblock %}
