{% extends "base.html" %}
{% block title %}Edit Barang{% endblock %}

{% block content %}
<div class="container">
  <div class="card shadow-sm rounded">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Edit Barang</h5>
    </div>
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="kode" class="form-label">Kode Barang</label>
          <input type="text" class="form-control" id="kode" name="kode" value="{{ barang.kode }}" required>
        </div>
        <div class="mb-3">
          <label for="nama" class="form-label">Nama Barang</label>
          <input type="text" class="form-control" id="nama" name="nama" value="{{ barang.nama }}" required>
        </div>
        <div class="mb-3">
          <label for="jumlah" class="form-label">Jumlah</label>
          <input type="number" class="form-control" id="jumlah" name="jumlah" value="{{ barang.jumlah }}" required>
        </div>
        <div class="mb-3">
          <label for="kondisi" class="form-label">Kondisi</label>
          <select class="form-select" id="kondisi" name="kondisi" required>
            <option value="Baik" {% if barang.kondisi == 'Baik' %}selected{% endif %}>Baik</option>
            <option value="Rusak" {% if barang.kondisi == 'Rusak' %}selected{% endif %}>Rusak</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="lokasi" class="form-label">Lokasi</label>
          <input type="text" class="form-control" id="lokasi" name="lokasi" value="{{ barang.lokasi }}" required>
        </div>
        <div class="mb-3">
          <label for="gambar" class="form-label">Ganti Gambar (Opsional)</label>
          <input type="file" class="form-control" id="gambar" name="gambar" accept="image/*">
        </div>
        <button type="submit" class="btn btn-success">Simpan</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Batal</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
